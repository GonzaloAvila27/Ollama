
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" type="text/css">
    <title>Interfaz Ollama</title>
</head>
<body>
    <!-- Navegador -->
    <nav>
        <div><strong>Chat IA</strong></div>
        <div class="nav-buttons">
            <button onclick="alert('Inicio clickeado')">Inicio</button>
            <button onclick="alert('Perfil clickeado')">Perfil</button>
            <div class="dropdown">
                <div class="dropdown-btn">Más ▼</div>
                <div class="dropdown-content">
                    <a href="#">Configuración</a>
                    <a href="#">Ayuda</a>
                    <a href="#">Cerrar sesión</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenedor de chat -->
    <div class="chat-container" id="chat">
        <!-- Mensajes se agregan aquí -->
    </div>

    <!-- Contenedor de entrada -->
    <div class="input-container">
        <input type="file" id="pdfInput" accept=".pdf">
        <input type="text" id="userInput" placeholder="Escribí tu mensaje o consulta sobre el PDF...">
        <button onclick="sendPDFQuery()">Enviar</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
